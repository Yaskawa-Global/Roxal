// The messages of Triton's GRPCInferenceService that ai.nn's Triton backend
// uses, trimmed from triton-inference-server/common protobuf/grpc_service.proto
// at commit 82f8bc7 (main, 2026-09-10).  Field numbers are the originals: they
// are the wire format.  Every field kept here has the same number and type in
// the r25.10 and r23.01 release branches, except InferParameter's
// double_param and uint64_param, which r23.01 predates (ai.nn sends neither).
// Omitted fields (the typed `contents` of tensors, which ai.nn never sends,
// and Triton never fills when raw contents are used) are skipped on parse.
//
// The package is renamed (Triton's is `inference`) so that a host linking
// Triton's own client library does not register the same descriptors twice.
// Message names never reach the wire; the calls are made by method path,
// "/inference.GRPCInferenceService/<Method>", so no service is declared here.

syntax = "proto3";

package roxal.triton;

message ServerLiveRequest {}

message ServerLiveResponse
{
  bool live = 1;
}

message RepositoryIndexRequest
{
  string repository_name = 1;
  bool ready = 2;
}

message RepositoryIndexResponse
{
  message ModelIndex
  {
    string name = 1;
    string version = 2;
    string state = 3;
    string reason = 4;
  }

  repeated ModelIndex models = 1;
}

message ModelRepositoryParameter
{
  oneof parameter_choice
  {
    bool bool_param = 1;
    int64 int64_param = 2;
    string string_param = 3;
    bytes bytes_param = 4;
  }
}

message RepositoryModelLoadRequest
{
  string repository_name = 1;
  string model_name = 2;
  map<string, ModelRepositoryParameter> parameters = 3;
}

message RepositoryModelLoadResponse {}

message RepositoryModelUnloadRequest
{
  string repository_name = 1;
  string model_name = 2;
  map<string, ModelRepositoryParameter> parameters = 3;
}

message RepositoryModelUnloadResponse {}

message ServerMetadataRequest {}

message ServerMetadataResponse
{
  string name = 1;
  string version = 2;
  repeated string extensions = 3;
}

message ModelReadyRequest
{
  string name = 1;
  string version = 2;
}

message ModelReadyResponse
{
  bool ready = 1;
}

message ModelMetadataRequest
{
  string name = 1;
  string version = 2;
}

message ModelMetadataResponse
{
  message TensorMetadata
  {
    string name = 1;
    string datatype = 2;
    repeated int64 shape = 3;
  }

  string name = 1;
  repeated string versions = 2;
  string platform = 3;
  repeated TensorMetadata inputs = 4;
  repeated TensorMetadata outputs = 5;
}

message InferParameter
{
  oneof parameter_choice
  {
    bool bool_param = 1;
    int64 int64_param = 2;
    string string_param = 3;
    double double_param = 4;
    uint64 uint64_param = 5;
  }
}

message ModelInferRequest
{
  message InferInputTensor
  {
    string name = 1;
    string datatype = 2;
    repeated int64 shape = 3;
    map<string, InferParameter> parameters = 4;
  }

  message InferRequestedOutputTensor
  {
    string name = 1;
    map<string, InferParameter> parameters = 2;
  }

  string model_name = 1;
  string model_version = 2;
  string id = 3;
  map<string, InferParameter> parameters = 4;
  repeated InferInputTensor inputs = 5;
  repeated InferRequestedOutputTensor outputs = 6;
  repeated bytes raw_input_contents = 7;
}

message ModelInferResponse
{
  message InferOutputTensor
  {
    string name = 1;
    string datatype = 2;
    repeated int64 shape = 3;
    map<string, InferParameter> parameters = 4;
  }

  string model_name = 1;
  string model_version = 2;
  string id = 3;
  map<string, InferParameter> parameters = 4;
  repeated InferOutputTensor outputs = 5;
  repeated bytes raw_output_contents = 6;
}
